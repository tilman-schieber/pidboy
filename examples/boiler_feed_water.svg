<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2190" height="740" viewBox="0 0 2190 740">
  <defs>
    <style>

    .equipment { fill: white; stroke: black; stroke-width: 1.5; }
    .valve { fill: white; stroke: black; stroke-width: 1.5; }
    .instrument { fill: white; stroke: black; stroke-width: 1.5; }
    .junction { fill: black; stroke: none; }
    .label { font-family: sans-serif; font-size: 11px; text-anchor: middle; fill: #333; }
    .line-label { font-family: sans-serif; font-size: 9px; text-anchor: middle; fill: #666; }
    .note { font-family: sans-serif; font-size: 11px; fill: #555; font-style: italic; }
    .line-process { fill: none; stroke: black; stroke-width: 2; }
    .line-utility { fill: none; stroke: black; stroke-width: 1; stroke-dasharray: 8,4; }
    .line-drain { fill: none; stroke: black; stroke-width: 1; stroke-dasharray: 4,2; }
    .line-vent { fill: none; stroke: black; stroke-width: 1; stroke-dasharray: 2,3; }
    .signal-electrical { fill: none; stroke: black; stroke-width: 1; }
    .signal-pneumatic { fill: none; stroke: black; stroke-width: 1; stroke-dasharray: 8,4; }
    .signal-hydraulic { fill: none; stroke: black; stroke-width: 1; stroke-dasharray: 10,2,1,2; }
    .signal-digital { fill: none; stroke: black; stroke-width: 1; stroke-dasharray: 6,2,1,2; }
    </style>
    <marker id="arrow-end" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="black"/>
    </marker>
    <marker id="arrow-end-pneumatic" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M 0 0 L 4 4 L 0 8" fill="none" stroke="black" stroke-width="1"/>
      <path d="M 4 0 L 8 4 L 4 8" fill="none" stroke="black" stroke-width="1"/>
    </marker>
    <g id="sym-vessel">
      <path d="M -45 -20 A 20 20 0 0 0 -45 20 L 45 20 A 20 20 0 0 0 45 -20 Z" fill="white" stroke="black" stroke-width="1.5"/>
    </g>
    <g id="sym-pump">
      <circle cx="0.0" cy="0.0" r="25.0" fill="white" stroke="black" stroke-width="1.5"/>
      <path d="M -8 -18 L 22 0 L -8 18 Z" fill="white" stroke="black" stroke-width="1.5"/>
    </g>
    <g id="sym-check_valve">
      <path d="M -18 -18 L 18 0 L -18 18 Z" fill="white" stroke="black" stroke-width="1.5"/>
      <line x1="18.0" y1="-18.0" x2="18.0" y2="18.0" fill="none" stroke="black" stroke-width="1.5"/>
    </g>
    <g id="sym-control_valve">
      <path d="M -22 -18 L 0 0 L -22 18 Z M 22 -18 L 0 0 L 22 18 Z" fill="white" stroke="black" stroke-width="1.5"/>
      <line x1="0.0" y1="0.0" x2="0.0" y2="-26.0" fill="none" stroke="black" stroke-width="1.5"/>
      <circle cx="0.0" cy="-33.0" r="8.0" fill="white" stroke="black" stroke-width="1.5"/>
    </g>
    <g id="sym-instr_field">
      <circle cx="0.0" cy="0.0" r="18.0" fill="white" stroke="black" stroke-width="1.5"/>
    </g>
    <g id="sym-instr_panel">
      <circle cx="0.0" cy="0.0" r="18.0" fill="white" stroke="black" stroke-width="1.5"/>
      <line x1="-18.0" y1="0.0" x2="18.0" y2="0.0" fill="none" stroke="black" stroke-width="1.5"/>
    </g>
    <g id="sym-instr_control_room">
      <circle cx="0.0" cy="0.0" r="18.0" fill="white" stroke="black" stroke-width="1.5"/>
      <circle cx="0.0" cy="0.0" r="13.0" fill="white" stroke="black" stroke-width="1.5"/>
    </g>
  </defs>
  <g id="lines">
    <polyline points="187.5,640.0 430.0,640.0" class="line-utility" fill="none" stroke="black" stroke-width="1" stroke-dasharray="8,4"/>
    <polyline points="530.0,640.0 920.0,640.0" class="line-process" fill="none" stroke="black" stroke-width="2"/>
    <polyline points="1000.0,640.0 1252.5,640.0" class="line-process" fill="none" stroke="black" stroke-width="2"/>
    <polyline points="1307.5,640.0 1572.5,640.0" class="line-process" fill="none" stroke="black" stroke-width="2"/>
    <polyline points="1627.5,640.0 2030.0,640.0" class="line-process" fill="none" stroke="black" stroke-width="2"/>
  </g>
  <g id="signals">
    <polyline points="1280.0,240.0 1600.0,240.0" class="signal-electrical" fill="none" stroke="black" stroke-width="1" marker-end="url(#arrow-end)"/>
    <polyline points="1600.0,240.0 1600.0,640.0" class="signal-pneumatic" fill="none" stroke="black" stroke-width="1" stroke-dasharray="8,4" marker-end="url(#arrow-end-pneumatic)"/>
    <polyline points="2080.0,550.0 2080.0,160.0" class="signal-electrical" fill="none" stroke="black" stroke-width="1" marker-end="url(#arrow-end)"/>
    <polyline points="2080.0,160.0 160.0,160.0 160.0,640.0" class="signal-pneumatic" fill="none" stroke="black" stroke-width="1" stroke-dasharray="8,4" marker-end="url(#arrow-end-pneumatic)"/>
  </g>
  <g id="symbols">
    <use id="D101" href="#sym-vessel" xlink:href="#sym-vessel" class="equipment" transform="translate(480.0,640.0)"/>
    <use id="P101" href="#sym-pump" xlink:href="#sym-pump" class="equipment" transform="translate(960.0,640.0)"/>
    <use id="NRV101" href="#sym-check_valve" xlink:href="#sym-check_valve" class="valve" transform="translate(1280.0,640.0)"/>
    <use id="FCV101" href="#sym-control_valve" xlink:href="#sym-control_valve" class="valve" transform="translate(1600.0,640.0)"/>
    <use id="SD101" href="#sym-vessel" xlink:href="#sym-vessel" class="equipment" transform="translate(2080.0,640.0)"/>
    <use id="MCV101" href="#sym-control_valve" xlink:href="#sym-control_valve" class="valve" transform="translate(160.0,640.0)"/>
    <use id="FT101" href="#sym-instr_field" xlink:href="#sym-instr_field" class="instrument" transform="translate(1280.0,240.0)"/>
    <use id="FIC101" href="#sym-instr_panel" xlink:href="#sym-instr_panel" class="instrument" transform="translate(1600.0,240.0)"/>
    <use id="LT101" href="#sym-instr_field" xlink:href="#sym-instr_field" class="instrument" transform="translate(2080.0,550.0)"/>
    <use id="LIC101" href="#sym-instr_control_room" xlink:href="#sym-instr_control_room" class="instrument" transform="translate(2080.0,160.0)"/>
  </g>
  <g id="labels">
    <text x="480.0" y="679.0" class="label">D-101</text>
    <text x="960.0" y="694.0" class="label">P-101</text>
    <text x="1280.0" y="681.5" class="label">NRV-101</text>
    <text x="1600.0" y="681.5" class="label">FCV-101</text>
    <text x="2080.0" y="679.0" class="label">SD-101</text>
    <text x="160.0" y="681.5" class="label">MCV-101</text>
    <text x="1280.0" y="284.0" class="label">FT-101</text>
    <text x="1600.0" y="284.0" class="label">FIC-101</text>
    <text x="2080.0" y="594.0" class="label">LT-101</text>
    <text x="2080.0" y="204.0" class="label">LIC-101</text>
    <text x="308.8" y="632.0" class="line-label">4in-BFW-0101</text>
    <text x="1440.0" y="632.0" class="line-label">4in-BFW-0104</text>
    <text x="1828.8" y="632.0" class="line-label">4in-BFW-0105</text>
    <text x="1440.0" y="232.0" class="line-label">4-20mA</text>
    <text x="1600.0" y="432.0" class="line-label" transform="rotate(-90,1600.0,432.0)">3-15psi</text>
    <text x="2080.0" y="347.0" class="line-label" transform="rotate(-90,2080.0,347.0)">4-20mA</text>
    <text x="1120.0" y="152.0" class="line-label">3-15psi</text>
  </g>
  <g id="notes">
  </g>
</svg>